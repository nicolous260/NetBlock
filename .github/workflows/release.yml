name: Release

# Publishes an APK as a GitHub release for the versionName in app/build.gradle.kts.
# It runs when that file (or this workflow) changes on main, or when a v* tag is pushed.
# If a release for that version already exists, nothing happens.
on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and whether it is already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.exists == 'false'

      - name: Restore signing key
        id: key
        if: steps.ver.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.NETBLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/netblock.jks"
            echo "NETBLOCK_KEYSTORE=$RUNNER_TEMP/netblock.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.ver.outputs.exists == 'false'
        env:
          NETBLOCK_KEYSTORE_PASSWORD: ${{ secrets.NETBLOCK_KEYSTORE_PASSWORD }}
          NETBLOCK_KEY_ALIAS: ${{ secrets.NETBLOCK_KEY_ALIAS }}
          NETBLOCK_KEY_PASSWORD: ${{ secrets.NETBLOCK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "NetBlock-${TAG}.apk"
          if [ "$SIGNED" = "true" ]; then
            gh release create "$TAG" "NetBlock-${TAG}.apk" --target "$GITHUB_SHA" \
              --title "NetBlock ${TAG}" --generate-notes
          else
            gh release create "$TAG" "NetBlock-${TAG}.apk" --target "$GITHUB_SHA" \
              --title "NetBlock ${TAG}" --generate-notes --prerelease \
              --notes "Signed with the debug key because no release keystore secret is configured. Fine for trying it out; updates won't install over a build signed with a different key."
          fi
